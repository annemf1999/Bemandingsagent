name: Deploy Bemandingsagent

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hent projektet
        uses: actions/checkout@v4

      - name: Opsæt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer pakker
        run: npm install

      - name: Byg hjemmesiden
        run: npm run build

      - name: Opsæt GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload hjemmeside
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Udgiv hjemmesiden
        id: deployment
        uses: actions/deploy-pages@v4
